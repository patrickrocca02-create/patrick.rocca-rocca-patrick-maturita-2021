<div id="input-container">
  <mat-form-field id="eq-form">
    <mat-label>Equazione</mat-label>
    <input class="inputMat" matInput type="text" [(ngModel)]="eqValue">
    <button mat-button *ngIf="eqValue" matSuffix mat-icon-button aria-label="Clear" (click)="eqValue=''">
      <mat-icon>close</mat-icon>
    </button>
  </mat-form-field>
  <mat-form-field id="un-form">
    <mat-label>Incognita</mat-label>
    <input class="inputMat" matInput type="text" [(ngModel)]="unValue">
    <button mat-button *ngIf="unValue" matSuffix mat-icon-button aria-label="Clear" (click)="unValue=''">
      <mat-icon>close</mat-icon>
    </button>
  </mat-form-field>
  <div id="btn-container">
    <button (click)="permormRequest()" class="math-calc-btn" mat-raised-button color="primary">Calcola</button>
  </div>
</div>
<div class="loading-container" *ngIf="loading">
  <mat-spinner></mat-spinner>
</div>
<div id="output-container" class="hidden">
  <div>Input:</div>
  <div id="input-label">

  </div>
  <div>Risultato:</div>
  <div id="output-label">

  </div>
</div>
<div id="math-error" *ngIf="error">
  {{ errorMessage }}
</div>
