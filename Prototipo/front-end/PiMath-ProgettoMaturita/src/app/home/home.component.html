<h1 id="welcome"> Bentornato <b>{{ firstName }}</b></h1>
<mat-grid-list cols="2" rowHeight="350px" style="margin-top: 30px">
  <mat-grid-tile *ngIf="isServiceActive('Equazioni')">
    <button [routerLink]="'/equations'" class="math-section-btn math-section-btn-left" mat-raised-button color="primary">
      <div style="margin-top: 25px; font-size: 100px;">$3x+\frac{{"{"}}1}{{"{"}}x}=0$</div>
      <div style="margin-top: 38px" class="section-text"><strong>Equazioni</strong></div>
      <div>{{ getServiceDescription('Equazioni') }}</div>
    </button>
  </mat-grid-tile>
  <mat-grid-tile *ngIf="isServiceActive('Disequazioni')">
    <button [routerLink]="'/inequalities'" class="math-section-btn math-section-btn-right" mat-raised-button color="primary">
      <div style="margin-top: 40px; font-size:100px;">$ln(x)+3\leq2$</div>
      <div style="margin-top: 28px" class="section-text"><strong>Disequazioni</strong></div>
      <div>{{ getServiceDescription('Disequazioni') }}</div>
    </button>
  </mat-grid-tile>
  <mat-grid-tile *ngIf="isServiceActive('Derivate')">
    <button [routerLink]="'/derivatives'" class="math-section-btn math-section-btn-left" mat-raised-button color="primary">
      <div style="font-size: 130px;">$\frac{{"{"}}d}{{"{"}}dx} f{{"{"}}\left(x \right)}$</div>
      <div style="margin-top: 22px" class="section-text"><strong>Derivate</strong></div>
      <div>{{ getServiceDescription('Derivate') }}</div>
    </button>
  </mat-grid-tile>
  <mat-grid-tile *ngIf="isServiceActive('Equazioni Differenziali')">
    <button [routerLink]="'/diff-equations'" class="math-section-btn math-section-btn-right" mat-raised-button color="primary">
      <div style="margin-top: 40px; font-size: 90px;">$4 \frac{{"{"}}d^{{"{"}}2}}{{"{"}}d x^{{"{"}}2}} f{{"{"}}\left(x \right)} + \frac{{"{"}}1}{{"{"}}2} \frac{{"{"}}d}{{"{"}}d x} f{{"{"}}\left(x \right)}$</div>
      <div style="margin-top: 40px" class="section-text"><strong>Equazioni Differenziali</strong></div>
      <div>{{ getServiceDescription('Equazioni Differenziali') }}</div>
    </button>
  </mat-grid-tile>
</mat-grid-list>

<mat-grid-list cols="1" rowHeight="150px">
  <mat-grid-tile>
    <button id="theory-btn" [routerLink]="'/topics'" class="math-section-btn math-section-btn-right" mat-raised-button color="primary">
      <div><b style="font-size: xx-large">Sezione di teoria</b></div>
    </button>
  </mat-grid-tile>
</mat-grid-list>
