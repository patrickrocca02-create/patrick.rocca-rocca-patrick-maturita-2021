<div id="input-container">
  <mat-form-field id="fun-form">
    <mat-label>Disequazione</mat-label>
    <input class="inputMat" matInput type="text" (keypress)="keyPress($event)" [(ngModel)]="ineqValue">
    <button mat-button *ngIf="ineqValue" matSuffix mat-icon-button aria-label="Clear" (click)="ineqValue=''">
      <mat-icon>close</mat-icon>
    </button>
  </mat-form-field>
  <mat-form-field id="var-form">
    <mat-label>Variabile</mat-label>
    <input class="inputMat" matInput type="text" [(ngModel)]="varValue">
    <button mat-button *ngIf="varValue" matSuffix mat-icon-button aria-label="Clear" (click)="varValue=''">
      <mat-icon>close</mat-icon>
    </button>
  </mat-form-field>
  <mat-form-field id="n-form">
    <mat-label>Simbolo</mat-label>
    <input class="inputMat" matInput type="text" [(ngModel)]="symValue">
    <button mat-button *ngIf="symValue" matSuffix mat-icon-button aria-label="Clear" (click)="symValue=''">
      <mat-icon>close</mat-icon>
    </button>
  </mat-form-field>
  <div id="btn-container">
    <button (click)="permormRequest()" class="math-calc-btn" mat-raised-button color="primary">Calcola</button>
  </div>
</div>
<div class="loading-container" *ngIf="loading">
  <mat-spinner></mat-spinner>
</div>
<div id="output-container" class="hidden">
  <div>Input:</div>
  <div id="input-label">

  </div>
  <div class="resultLabel">Risultato:</div>
  <div id="output-label">

  </div>
</div>
<div id="math-error" *ngIf="error">
  {{ errorMessage }}
</div>
