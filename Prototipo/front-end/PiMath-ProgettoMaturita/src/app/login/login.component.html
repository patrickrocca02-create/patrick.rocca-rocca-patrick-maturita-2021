<mat-card id="login-card">
  <mat-card-title style="font-size: 60px; margin-top: 20px">Login</mat-card-title>
  <mat-card-content>
    <form [formGroup]="formLogin" (ngSubmit)="submit()">
      <p>
        <mat-form-field style="font-size: 25px; margin-top: 50px; width: 85%">
          <input type="text" matInput placeholder="Username" formControlName="username">
        </mat-form-field>
      </p>

      <p>
        <mat-form-field style="font-size: 25px; margin-top: -20px; width: 85%">
          <input type="password" matInput placeholder="Password" formControlName="password">
        </mat-form-field>
      </p>

      <div>
        <button type="submit" mat-button id="login-btn">Login</button>
      </div>

    </form>
    <p style="font-size: large; margin: 10px">Non hai ancora un account? <a routerLink="/register">Registrati!</a></p>
  </mat-card-content>
  <div id="login-error" *ngIf="error">
    Errore
  </div>
</mat-card>
