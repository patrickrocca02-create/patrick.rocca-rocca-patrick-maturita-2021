<mat-card id="register-card">
  <mat-card-title style="font-size: 60px; margin-top: 20px">Registrazione</mat-card-title>
  <mat-card-content>
    <form [formGroup]="formRegister" (ngSubmit)="submit()">
      <p style="margin-top: 20px">
        <mat-form-field class="even">
          <input type="text" matInput placeholder="Username" formControlName="username">
        </mat-form-field>
        <mat-form-field>
          <input type="text" matInput placeholder="Email" formControlName="email">
        </mat-form-field>
      </p>

      <p>
        <mat-form-field class="even">
          <input type="text" matInput placeholder="Nome" formControlName="name">
        </mat-form-field>
        <mat-form-field>
          <input type="text" matInput placeholder="Cognome" formControlName="surname">
        </mat-form-field>
      </p>

      <p>
        <mat-form-field class="even">
          <input type="password" matInput placeholder="Password" formControlName="password">
        </mat-form-field>
        <mat-form-field>
          <input type="password" matInput placeholder="Conferma Password" formControlName="confirmPassword">
        </mat-form-field>
      </p>
      <mat-form-field appearance="fill" id="plan-select">
        <mat-label>Piano</mat-label>
        <mat-select formControlName="plan">
          <mat-option *ngFor="let plan of plans" [value]="plan.planID" [matTooltip]="plan.description + ' - ' + plan.pricePerMonth + '€/mese'">
            {{ plan.planName }}
          </mat-option>
        </mat-select>
      </mat-form-field>
      <div>
        <button type="submit" mat-button id="register-btn">Registrati</button>
      </div>

    </form>
    <p style="font-size: large; margin: 10px">Hai già un account? <a routerLink="/login">Accedi</a></p>
  </mat-card-content>
  <div id="login-error" *ngIf="error">
    {{ errorMessage }}
  </div>
</mat-card>
